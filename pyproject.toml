[project]
name = "sevenheavens-editor"
version = "0.1.0"
description = "Local, source-traceable video editing prototype"
requires-python = ">=3.11,<3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
